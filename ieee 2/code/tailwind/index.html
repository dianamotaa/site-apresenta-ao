<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
      <a href="#/" class="text-blue-600 font-semibold hover:underline">Home</a>
      <a href="#/new" class="text-blue-600 font-semibold hover:underline">New Post</a>
    </nav>

    <div id="content">
      <!-- Listing Page -->
      <div id="listingPage">
        <!-- Search Feature -->
        <div class="mb-4">
          <input id="searchInput" type="text" placeholder="Search posts..." class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>

        <h1 class="text-3xl font-bold mb-6">Listing Posts</h1>
        <div id="postsList">
          <div class="bg-white p-4 mb-4 rounded shadow">
            <h2 class="text-xl font-bold">Post 1</h2>
            <p class="text-gray-700">Lorem ipsum dolor sit amet.</p>
          </div>

          <div class="bg-white p-4 mb-4 rounded shadow">
            <h2 class="text-xl font-bold">Post 2</h2>
            <p class="text-gray-700">Lorem ipsum dolor sit amet.</p>
          </div>
           
          <div class="bg-white p-4 mb-4 rounded shadow">
            <h2 class="text-xl font-bold">Post 3</h2>
            <p class="text-gray-700">Lorem ipsum dolor sit amet.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
