<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="main.js" defer></script>
</head>

<body class="bg-gray-50">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <!-- Navigation -->
    <nav class="flex justify-between items-center mb-8 border-b border-gray-200 pb-4">
      <a href="#/" class="text-blue-600 font-semibold hover:underline">Home</a>
      <a href="#/new" class="text-blue-600 font-semibold hover:underline">New Post</a>
    </nav>

    <div id="content">
      <!-- Listing Page -->
      <div id="listingPage">
        <!-- Search Feature -->
        <div class="mb-4">
          <input id="searchInput" type="text" placeholder="Search posts..." class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>

        <h1 class="text-3xl font-bold mb-6">Listing Posts</h1>
        <div id="postsList">
          <!-- Posts will be dynamically rendered here -->
        </div>
      </div>

      <!-- New Post Page -->
      <div id="newPostPage" class="hidden">
        <h1 class="text-3xl font-bold mb-6">New Post</h1>
        <form id="newPostForm" class="bg-white border border-gray-200 rounded-lg shadow p-6">
          <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input 
              id="title" 
              name="title"
              type="text" 
              required
              class="w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3"
            >
          </div>
          <div class="mb-6">
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea 
              id="description"
              name="description" 
              required
              class="w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3"
            ></textarea>
          </div>
          
          <!-- Notice button with type submit -->
          <div class="flex justify-end">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
